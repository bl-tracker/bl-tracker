{% extends "base.html" %}
{% block content %}

<section class="formwrap">
  <h2>{{ t('add_title') if mode == 'add' else t('edit_title') }}</h2>

  <form method="post" enctype="multipart/form-data" action="{{ url_for('add') if mode == 'add' else url_for('edit', bl_id=bl_id) }}" class="blform">
    <label>
      {{ t('bl_no') }} <span class="req">*</span>
      <input type="text" name="bl_no" value="{{ bl.bl_no or '' }}" required class="mono">
    </label>

    <label>
      {{ t('client') }}
      <input type="text" name="client" value="{{ bl.client or '' }}">
    </label>

    <label>
      {{ t('agent') }}
      <input type="text" name="agent" value="{{ bl.agent or '' }}" list="agents-list">
      <datalist id="agents-list">
        {% for a in agents or [] %}<option value="{{ a }}">{% endfor %}
      </datalist>
    </label>

    <label>
      {{ t('vessel') }}
      <input type="text" name="vessel" value="{{ bl.vessel or '' }}">
    </label>

    <label>
      {{ t('shipping_line') }}
      <input type="text" name="shipping_line" value="{{ bl.shipping_line or '' }}">
      <small class="hint">{{ t('sl_auto_hint') }}</small>
    </label>

    <label>
      {{ t('item') }}
      <input type="text" name="item" value="{{ bl.item or '' }}">
    </label>

    <label>
      {{ t('all_kinds') }}
      <select name="kind">
        <option value="" {{ 'selected' if not bl.kind }}>—</option>
        <option value="Container" {{ 'selected' if bl.kind=='Container' }}>{{ t('kind_container') }}</option>
        <option value="Vehicle" {{ 'selected' if bl.kind=='Vehicle' }}>{{ t('kind_vehicle') }}</option>
      </select>
    </label>

    <label>
      {{ t('status') }}
      <input type="text" name="status" value="{{ bl.status or '' }}">
    </label>

    <label>
      {{ t('category') }}
      <select name="category">
        {% set cur = bl.category or 'in_progress' %}
        <option value="completed" {{ 'selected' if cur=='completed' }}>{{ t('completed') }}</option>
        <option value="in_progress" {{ 'selected' if cur=='in_progress' }}>{{ t('in_progress') }}</option>
        <option value="problem" {{ 'selected' if cur=='problem' }}>{{ t('problem') }}</option>
        <option value="other" {{ 'selected' if cur=='other' }}>{{ t('other') }}</option>
      </select>
    </label>

    <label>
      {{ t('bl_date') }}
      <input type="date" name="bl_date" value="{{ bl.bl_date or '' }}">
    </label>

    <label>
      {{ t('icd') }}
      <input type="text" name="icd" value="{{ bl.icd or '' }}">
    </label>

    <label>
      {{ t('eta') }}
      <input type="date" name="eta" value="{{ bl.eta or '' }}">
    </label>

    <label>
      {{ t('manifest_date') }}
      <input type="date" name="manifest_date" value="{{ bl.manifest_date or '' }}">
      <small class="hint">{{ t('manifest_from_tanesw') }}</small>
    </label>

    <label>
      {{ t('carry_in_date') }}
      <input type="date" name="carry_in_date" value="{{ bl.carry_in_date or '' }}">
    </label>

    <label>
      {{ t('release_date') }}
      <input type="date" name="release_date" value="{{ bl.release_date or '' }}">
    </label>

    <label>
      {{ t('gate_out_date') }}
      <input type="date" name="gate_out_date" value="{{ bl.gate_out_date or '' }}">
    </label>

    <label>
      {{ t('tansad_no') }}
      <input type="text" name="tansad_no" value="{{ bl.tansad_no or '' }}">
    </label>

    <label>
      {{ t('duty_paid') }}
      <input type="text" name="duty_paid" value="{{ bl.duty_paid or '' }}">
    </label>

    <label>
      {{ t('container_count') }}
      <input type="text" name="container_count" value="{{ bl.container_count or '' }}">
    </label>

    <label class="full">
      {{ t('containers') }}
      <input type="text" name="containers" value="{{ bl.containers or '' }}" class="mono" placeholder="MSCU1234567, TGHU7654321">
    </label>

    <label class="full">
      {{ t('notes') }}
      <textarea name="notes" rows="3">{{ bl.notes or '' }}</textarea>
    </label>

    <label class="full">
      {{ t('document') }}
      <input type="file" name="document" accept=".pdf,.png,.jpg,.jpeg,.webp">
      <small class="hint">{{ t('doc_hint') }}</small>
      {% if has_doc %}
        <small class="hint">✅ {{ t('has_doc') }} —
          <a href="{{ url_for('document', bl_id=bl_id) }}" target="_blank">{{ t('view_doc') }}</a>
        </small>
      {% endif %}
    </label>

    <div class="formactions">
      <button type="submit" class="btn btn-primary">{{ t('save') }}</button>
      <a href="{{ url_for('bl') }}" class="btn btn-ghost">{{ t('cancel') }}</a>
    </div>
  </form>
</section>

{% endblock %}
