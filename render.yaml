# Usanidi wa Render (hiari). Unaweza "New + > Blueprint" ukitumia repo hii.
services:
  - type: web
    name: bl-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NOTIFY_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: NOTIFY_LANG
        value: sw
      - key: RUN_SCHEDULER
        value: "0"
